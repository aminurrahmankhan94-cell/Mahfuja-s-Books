<!-- Splash Screen -->
<div id="splashScreen" class="splash-screen">
  <div class="splash-content">
    <h1 class="splash-logo">Onukto</h1>
    <div class="loader-spinner"></div>
    <p class="splash-developer">Developed by Raflido Studios</p>
  </div>
</div>

<!-- User Control Bar -->
<div class="user-control-bar">
  <button id="settingsBtn" onclick="openSettingsModal()" class="action-btn" style="display:none;">Settings</button>
  
  <div id="userBadge" class="user-badge" style="display:none;">
    <img id="userAvatar" src="" alt="User" class="avatar">
    <span id="userName">User</span>
    <button onclick="googleSignOut()" class="btn-logout">Sign Out</button>
  </div>
  <button id="loginBtn" onclick="googleSignIn()" class="btn-primary">Sign In</button>
</div>

<!-- Main Content Area -->
<div class="main-container">
  <!-- Articles Grid -->
  <div id="articlesGrid" class="grid-container"></div>
</div>

<!-- Admin Panel (Tabbed) -->
<div id="adminPanel" class="admin-panel-container" style="display:none;">
  <h2>Admin Dashboard</h2>
  <div class="admin-tabs">
    <button class="admin-tab-btn active" onclick="switchAdminTab('tab-posts', this)">Manage Posts</button>
    <button class="admin-tab-btn" onclick="switchAdminTab('tab-author', this)">Author Profile</button>
    <button class="admin-tab-btn" onclick="switchAdminTab('tab-users', this)">Users</button>
    <button class="admin-tab-btn" onclick="switchAdminTab('tab-reports', this)">Reports</button>
  </div>

  <div id="tab-posts" class="admin-tab-content active">
    <h3>Create / Manage Articles</h3>
    <div id="adminPostList"></div>
  </div>

  <div id="tab-author" class="admin-tab-content">
    <h3>Author Profile Settings</h3>
    <input type="text" id="authorNameInput" placeholder="Author Name">
    <textarea id="authorBioInput" placeholder="Author Bio"></textarea>
    <input type="text" id="authorImgInput" placeholder="Image URL">
    <button onclick="saveAuthorProfile()" class="btn-primary">Save Profile</button>
  </div>

  <div id="tab-users" class="admin-tab-content">
    <h3>Registered Users</h3>
    <div id="adminUserList"></div>
  </div>

  <div id="tab-reports" class="admin-tab-content">
    <h3>User Reports</h3>
    <div id="adminReportList"></div>
  </div>
</div>

<!-- Settings Modal for Users -->
<div id="settingsModal" class="modal-overlay" style="display:none;">
  <div class="modal-card">
    <h3>User Settings</h3>
    <div class="settings-group">
      <label>Theme Preference:</label>
      <button id="themeToggleBtn" onclick="toggleTheme()" class="btn-secondary">Switch to Light Mode</button>
    </div>
    <div class="settings-group" style="margin-top: 15px;">
      <label>Reader Text Size:</label>
      <button id="textSizeBtn" onclick="toggleTextSize()" class="btn-secondary">Switch to Large Text</button>
    </div>
    <div style="margin-top:20px; text-align:right;">
      <button onclick="closeSettingsModal()" class="btn-primary">Close</button>
    </div>
  </div>
</div>

<!-- Report Modal -->
<div id="reportModal" class="modal-overlay" style="display:none;">
  <div class="modal-card">
    <h3>Report Post</h3>
    <p id="reportPostTitle" style="color:var(--text-muted); font-size:14px;"></p>
    <textarea id="reportReason" placeholder="Write reason for reporting..." style="width:100%; height:80px; margin:10px 0; padding:10px; border-radius:6px; background:var(--bg-color); color:var(--text-main); border:1px solid var(--card-border);"></textarea>
    <div style="display:flex; gap:10px; justify-content:flex-end;">
      <button onclick="closeReportModal()" class="btn-secondary">Cancel</button>
      <button onclick="submitReport()" class="btn-danger">Submit Report</button>
    </div>
  </div>
</div>

<!-- Professional Footer -->
<footer class="site-footer">
  <div class="footer-content">
    <h3 class="footer-brand">Onukto</h3>
    <p class="footer-dev">Developed by <strong>Raflido Studios</strong></p>
    <div class="footer-links">
      <a href="#">Privacy Policy</a>
      <a href="#">Terms of Service</a>
      <a href="#">Contact Us</a>
    </div>
    <p class="copyright">&copy; 2026 Raflido Studios. All rights reserved.</p>
  </div>
</footer>
