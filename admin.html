<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Literary Vault</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav class="navbar">
    <div class="brand-logo rainbow-text">⚡ Admin Dashboard</div>
    <a href="index.html" class="nav-btn">📖 Reader Portal</a>
  </nav>

  <div class="container">
    
    <!-- Login Screen -->
    <div id="loginSection" class="article-card" style="max-width:400px; margin: 50px auto;">
      <h2 style="margin-bottom:15px;" class="rainbow-text">Admin Login</h2>
      <div class="form-group">
        <label>User ID</label>
        <input type="text" id="adminId" class="form-control" placeholder="Enter ID">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="adminPass" class="form-control" placeholder="Enter Password">
      </div>
      <button onclick="handleLogin()" class="submit-btn">Login to Portal</button>
    </div>

    <!-- Admin Panel (Logged In) -->
    <div id="adminPanel" style="display: none;">
      
      <!-- Stats Overview -->
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-number" id="totalPosts">0</div>
          <div style="color:#94a3b8;">Total Posts</div>
        </div>
        <div class="stat-card">
          <div class="stat-number" id="totalLikes">0</div>
          <div style="color:#94a3b8;">Total Likes</div>
        </div>
        <div class="stat-card">
          <div class="stat-number" id="totalComments">0</div>
          <div style="color:#94a3b8;">Total Comments</div>
        </div>
      </div>

      <!-- Add New Article Form -->
      <div class="article-card">
        <h2 style="margin-bottom:20px;" class="rainbow-text">✍️ Publish New Literary Work</h2>
        
        <div class="form-group">
          <label>Title</label>
          <input type="text" id="title" class="form-control" placeholder="Enter title">
        </div>

        <div class="form-group">
          <label>Author / Poet Name</label>
          <input type="text" id="author" class="form-control" placeholder="Enter author name">
        </div>

        <div class="form-group">
          <label>Catalog / Category</label>
          <select id="subject" class="form-control">
            <option value="Story">Story</option>
            <option value="Poem">Poem</option>
            <option value="Novel">Novel</option>
            <option value="Essay">Essay</option>
            <option value="Drama">Drama</option>
          </select>
        </div>

        <div class="form-group">
          <label>Full Content</label>
          <textarea id="content" class="form-control" rows="8" placeholder="Write your text here..."></textarea>
        </div>

        <button onclick="publishArticle()" id="pubBtn" class="submit-btn">Publish Work</button>
      </div>

      <!-- Article Manager Table -->
      <div class="article-card">
        <h2>📂 Manage Uploaded Posts</h2>
        <table class="admin-table">
          <thead>
            <tr>
              <th>Title</th>
              <th>Catalog</th>
              <th>Author</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="adminTableBody"></tbody>
        </table>
      </div>

    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBzvxeq6feVCSdcDVywh7mWikxbD3RryuU",
      authDomain: "my-writer-gallery-2cd87.firebaseapp.com",
      projectId: "my-writer-gallery-2cd87",
      storageBucket: "my-writer-gallery-2cd87.firebasestorage.app",
      messagingSenderId: "233413550719",
      appId: "1:233413550719:web:fe5e2eae246ee601a3d54a"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const AUTH_ID = "admin";
    const AUTH_PASS = "12345";

    function handleLogin() {
      if(document.getElementById('adminId').value === AUTH_ID && document.getElementById('adminPass').value === AUTH_PASS) {
        document.getElementById('loginSection').style.display = 'none';
        document.getElementById('adminPanel').style.display = 'block';
        loadAdminData();
      } else {
        alert("Invalid Admin Credentials!");
      }
    }

    function publishArticle() {
      const title = document.getElementById('title').value.trim();
      const author = document.getElementById('author').value.trim();
      const subject = document.getElementById('subject').value;
      const content = document.getElementById('content').value.trim();

      if(!title || !content) return alert("Please enter Title and Content!");

      db.collection("articles").add({
        title, author: author || "Anonymous", subject, content,
        likes: 0, comments: [], createdAt: new Date()
      }).then(() => {
        alert("🎉 Article published successfully!");
        document.getElementById('title').value = '';
        document.getElementById('author').value = '';
        document.getElementById('content').value = '';
      });
    }

    function loadAdminData() {
      db.collection("articles").onSnapshot(snapshot => {
        const tbody = document.getElementById('adminTableBody');
        tbody.innerHTML = '';
        let tLikes = 0, tComments = 0, count = 0;

        snapshot.forEach(doc => {
          count++;
          const data = doc.data();
          tLikes += (data.likes || 0);
          tComments += (data.comments ? data.comments.length : 0);

          tbody.innerHTML += `
            <tr>
              <td><strong>${data.title}</strong></td>
              <td>${data.subject}</td>
              <td>${data.author || 'N/A'}</td>
              <td><button class="btn-danger" onclick="deleteArticle('${doc.id}')">Delete</button></td>
            </tr>
          `;
        });

        document.getElementById('totalPosts').innerText = count;
        document.getElementById('totalLikes').innerText = tLikes;
        document.getElementById('totalComments').innerText = tComments;
      });
    }

    function deleteArticle(id) {
      if(confirm("Are you sure you want to delete this post?")) {
        db.collection("articles").doc(id).delete().then(() => {
          alert("Post deleted successfully!");
        });
      }
    }
  </script>
</body>
</html>
