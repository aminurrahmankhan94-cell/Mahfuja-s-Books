  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBzvxeq6feVCSdcDVywh7mWikxbD3RryuU",
      authDomain: "my-writer-gallery-2cd87.firebaseapp.com",
      projectId: "my-writer-gallery-2cd87",
      storageBucket: "my-writer-gallery-2cd87.firebasestorage.app",
      messagingSenderId: "233413550719",
      appId: "1:233413550719:web:fe5e2eae246ee601a3d54a"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let adminArticlesCache = [];
    let cachedUsers = [];

    function handleLogin() {
      if (document.getElementById('adminId').value === 'admin' && document.getElementById('adminPass').value === '12345') {
        document.getElementById('loginSection').style.display = 'none';
        document.getElementById('adminPanel').style.display = 'block';
        loadAuthorProfile();
        loadAdminData();
        loadUserData();
      } else alert("Invalid ID or Password.");
    }

    // Tab Switching Functionality
    function switchAdminTab(e, tabId) {
      document.querySelectorAll('.admin-tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.admin-tab-btn').forEach(btn => btn.classList.remove('active'));
      
      document.getElementById(tabId).classList.add('active');
      if (e && e.currentTarget) {
        e.currentTarget.classList.add('active');
      }
    }

    // High-Ratio Image Compression
    function convertImageToBase64(fileInput, previewId, hiddenInputId, maxDim) {
      const file = fileInput.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function (e) {
          const img = new Image();
          img.src = e.target.result;
          img.onload = function() {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;

            if (width > maxDim || height > maxDim) {
              if (width > height) {
                height = Math.round((height * maxDim) / width);
                width = maxDim;
              } else {
                width = Math.round((width * maxDim) / height);
                height = maxDim;
              }
            }

            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, width, height);

            const compressedBase64 = canvas.toDataURL('image/jpeg', 0.5);
            document.getElementById(hiddenInputId).value = compressedBase64;
            const previewImg = document.getElementById(previewId);
            previewImg.src = compressedBase64;
            previewImg.style.display = 'block';
          };
        };
        reader.readAsDataURL(file);
      }
    }

    function loadAuthorProfile() {
      db.collection("settings").doc("authorProfile").get().then(doc => {
        if (doc.exists) {
          const d = doc.data();
          document.getElementById('authorNameInput').value = d.name || '';
          document.getElementById('authorBioInput').value = d.bio || '';
          if (d.image) {
            document.getElementById('authorImgData').value = d.image;
            const img = document.getElementById('authorImgPreview');
            img.src = d.image;
            img.style.display = 'block';
          }
        }
      });
    }

    function saveAuthorProfile() {
      const btn = event.target;
      btn.innerText = "SAVING...";
      btn.disabled = true;

      db.collection("settings").doc("authorProfile").set({
        name: document.getElementById('authorNameInput').value,
        image: document.getElementById('authorImgData').value,
        bio: document.getElementById('authorBioInput').value
      }).then(() => {
        alert("Author Profile Updated successfully!");
        btn.innerText = "SAVE PROFILE DETAILS";
        btn.disabled = false;
      }).catch(err => {
        alert("Error: " + err.message);
        btn.innerText = "SAVE PROFILE DETAILS";
        btn.disabled = false;
      });
    }

    function saveArticle() {
      const saveBtn = document.getElementById('savePostBtn');
      const editId = document.getElementById('editArticleId').value;
      const title = document.getElementById('title').value.trim();
      const author = document.getElementById('author').value.trim() || "Mahfuja";
      const subject = document.getElementById('subject').value;
      const imageUrl = document.getElementById('postImgData').value;
      const content = document.getElementById('content').value.trim();

      if (!title || !content) return alert("Title and Content are required.");

      saveBtn.innerText = "PUBLISHING...";
      saveBtn.disabled = true;

      const postData = { title, author, subject, imageUrl, content };

      if (editId) {
        db.collection("articles").doc(editId).update(postData).then(() => {
          alert("Post Updated Successfully!");
          saveBtn.innerText = "PUBLISH WORK";
          saveBtn.disabled = false;
          resetForm();
        }).catch(err => {
          alert("Update Error: " + err.message);
          saveBtn.innerText = "UPDATE POST";
          saveBtn.disabled = false;
        });
      } else {
        postData.likes = [];
        postData.comments = [];
        postData.isPinned = false;
        postData.createdAt = new Date().toISOString();

        db.collection("articles").add(postData).then(() => {
          alert("Published Successfully!");
          saveBtn.innerText = "PUBLISH WORK";
          saveBtn.disabled = false;
          resetForm();
        }).catch(err => {
          alert("Publish Error: " + err.message);
          saveBtn.innerText = "PUBLISH WORK";
          saveBtn.disabled = false;
        });
      }
    }

    function editPost(id, title, author, subject, imageUrl, content) {
      document.querySelectorAll('.admin-tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.admin-tab-btn').forEach(btn => btn.classList.remove('active'));
      document.getElementById('tab-publish').classList.add('active');

      document.getElementById('editArticleId').value = id;
      document.getElementById('title').value = title;
      document.getElementById('author').value = author;
      document.getElementById('subject').value = subject;
      document.getElementById('postImgData').value = imageUrl || '';
      document.getElementById('content').value = content;

      const previewImg = document.getElementById('postImgPreview');
      if (imageUrl) {
        previewImg.src = imageUrl;
        previewImg.style.display = 'block';
      } else {
        previewImg.style.display = 'none';
      }

      document.getElementById('formHeading').innerText = "EDIT POST";
      document.getElementById('savePostBtn').innerText = "UPDATE POST";
      document.getElementById('cancelEditBtn').style.display = "inline-block";
      window.scrollTo({ top: document.getElementById('postFormCard').offsetTop - 20, behavior: 'smooth' });
    }

    function resetForm() {
      document.getElementById('editArticleId').value = '';
      document.getElementById('title').value = '';
      document.getElementById('author').value = '';
      document.getElementById('postImgData').value = '';
      document.getElementById('postImgFile').value = '';
      document.getElementById('postImgPreview').style.display = 'none';
      document.getElementById('content').value = '';
      document.getElementById('formHeading').innerText = "PUBLISH NEW WORK";
      document.getElementById('savePostBtn').innerText = "PUBLISH WORK";
      document.getElementById('savePostBtn').disabled = false;
      document.getElementById('cancelEditBtn').style.display = "none";
    }

    function togglePin(id, currentPin) {
      db.collection("articles").doc(id).update({ isPinned: !currentPin });
    }

    // Load & Control Registered Readers
    function loadUserData() {
      db.collection("users").onSnapshot(snapshot => {
        cachedUsers = [];
        snapshot.forEach(doc => {
          cachedUsers.push({ id: doc.id, ...doc.data() });
        });
        renderUserTable();
      });
    }

    function renderUserTable() {
      const tbody = document.getElementById('userTableBody');
      if (!tbody) return;
      tbody.innerHTML = ''; 
      let uCount = cachedUsers.length;

      cachedUsers.forEach(u => {
        const isBanned = u.isBanned || false;
        const uid = u.id;
        const userEmail = u.email || '';

        // Calculate specific user likes & comments across all articles
        let userLikes = [];
        let userComments = [];

        adminArticlesCache.forEach(art => {
          const likes = Array.isArray(art.likes) ? art.likes : [];
          const comments = Array.isArray(art.comments) ? art.comments : [];

          if (likes.some(l => (typeof l === 'string' ? l === uid : (l.uid === uid || (l.email && l.email === userEmail))))) {
            userLikes.push({ articleId: art.id, postTitle: art.title });
          }

          comments.forEach(c => {
            if (c.uid === uid || (c.email && c.email === userEmail)) {
              userComments.push({ articleId: art.id, postTitle: art.title, commentId: c.id, text: c.text });
            }
          });
        });

        const userRating = u.rating || 5;

        tbody.innerHTML += `
          <tr>
            <td>
              <strong>${escapeQuotes(u.name || 'Reader')}</strong><br>
              <small style="color:var(--text-muted);">Rating: ${'⭐'.repeat(userRating)} (${userRating}/5)</small>
            </td>
            <td>${escapeQuotes(userEmail)}</td>
            <td><small style="color:var(--text-muted);">${uid}</small></td>
            <td><span style="color: ${isBanned ? 'var(--danger-color)' : '#00ff66'}; font-weight:700;">${isBanned ? 'BANNED' : 'ACTIVE'}</span></td>
            <td>
              <button class="${isBanned ? 'btn-primary' : 'btn-danger'}" style="padding:4px 8px; font-size:10px;" onclick="toggleBanUser('${uid}', ${isBanned})">
                ${isBanned ? 'UNBAN' : 'BAN'}
              </button>
              <button class="btn-outline" style="padding:4px 8px; font-size:10px; margin-left:4px;" onclick="toggleUserActivity('${uid}')">
                Activity (${userLikes.length} Likes, ${userComments.length} Comments)
              </button>
              <button class="btn-danger" style="padding:4px 8px; font-size:10px; margin-left:4px;" onclick="deleteUserRecord('${uid}')">Delete</button>
            </td>
          </tr>
          <tr id="user-act-${uid}" style="display:none; background:var(--bg-color);">
            <td colspan="5" style="padding:12px 15px;">
              <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                <strong style="font-size:11px; color:var(--accent-gold); letter-spacing:1px;">USER ACTIVITY & RATING CONTROL</strong>
                <div>
                  <label style="font-size:11px; color:var(--text-muted); margin-right:5px;">Set Rating:</label>
                  <select onchange="updateUserRating('${uid}', this.value)" style="padding:2px 6px; font-size:11px; background:var(--card-bg); color:var(--text-main); border:1px solid var(--card-border); border-radius:4px;">
                    <option value="5" ${userRating == 5 ? 'selected' : ''}>5 Stars</option>
                    <option value="4" ${userRating == 4 ? 'selected' : ''}>4 Stars</option>
                    <option value="3" ${userRating == 3 ? 'selected' : ''}>3 Stars</option>
                    <option value="2" ${userRating == 2 ? 'selected' : ''}>2 Stars</option>
                    <option value="1" ${userRating == 1 ? 'selected' : ''}>1 Star</option>
                  </select>
                </div>
              </div>

              <!-- Liked Posts List -->
              <div style="margin-bottom:10px;">
                <strong style="font-size:10px; color:var(--text-muted); letter-spacing:1px;">LIKED POSTS (${userLikes.length}):</strong>
                ${userLikes.length === 0 ? '<p style="font-size:11px; color:var(--text-muted); margin-top:3px;">No likes yet.</p>' : ''}
                ${userLikes.map(l => `
                  <div style="font-size:11px; margin-top:3px; background:var(--card-bg); padding:4px 8px; border-radius:3px; display:flex; justify-content:space-between; border:1px solid var(--card-border);">
                    <span>Post: <strong>${escapeQuotes(l.postTitle)}</strong></span>
                    <button class="btn-danger" style="padding:1px 4px; font-size:9px;" onclick="removeSpecificLike('${l.articleId}', '${uid}')">Remove Like</button>
                  </div>
                `).join('')}
              </div>

              <!-- User Comments List -->
              <div>
                <strong style="font-size:10px; color:var(--text-muted); letter-spacing:1px;">COMMENTS (${userComments.length}):</strong>
                ${userComments.length === 0 ? '<p style="font-size:11px; color:var(--text-muted); margin-top:3px;">No comments yet.</p>' : ''}
                ${userComments.map(c => `
                  <div style="margin-top:6px; font-size:12px; background:var(--card-bg); padding:8px; border-radius:4px; border:1px solid var(--card-border);">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                      <span>On <strong>${escapeQuotes(c.postTitle)}</strong>: "${escapeQuotes(c.text)}"</span>
                      <button class="btn-danger" style="padding:2px 6px; font-size:9px;" onclick="deleteComment('${c.articleId}', '${c.commentId}')">Delete Comment</button>
                    </div>
                  </div>
                `).join('')}
              </div>
            </td>
          </tr>`;
      });
      document.getElementById('totalUsers').innerText = uCount;
    }

    function toggleUserActivity(uid) {
      const row = document.getElementById(`user-act-${uid}`);
      if (row) {
        row.style.display = row.style.display === 'table-row' ? 'none' : 'table-row';
      }
    }

    function updateUserRating(uid, ratingVal) {
      db.collection("users").doc(uid).update({ rating: parseInt(ratingVal) }).then(() => {
        alert("User rating updated!");
        renderUserTable();
      });
    }

    function deleteUserRecord(uid) {
      if (confirm("Are you sure you want to delete this user profile?")) {
        db.collection("users").doc(uid).delete().then(() => alert("User profile deleted."));
      }
    }

    function toggleBanUser(uid, currentBanned) {
      db.collection("users").doc(uid).update({ isBanned: !currentBanned });
    }

    function loadAdminData() {
      db.collection("articles").onSnapshot(snapshot => {
        adminArticlesCache = [];
        const tbody = document.getElementById('adminTableBody');
        tbody.innerHTML = ''; let tLikes = 0, count = 0;

        snapshot.forEach(doc => {
          count++; 
          const data = doc.data(); 
          adminArticlesCache.push({ id: doc.id, ...data });

          const likes = Array.isArray(data.likes) ? data.likes : []; 
          const comments = Array.isArray(data.comments) ? data.comments : [];
          tLikes += likes.length;

          let likersHtml = likes.map(l => {
            const name = typeof l === 'string' ? 'User UID' : (l.name || 'Reader');
            const email = typeof l === 'string' ? l : (l.email || '');
            const uid = typeof l === 'string' ? l : l.uid;
            return `<div style="font-size:11px; margin-top:3px; background:var(--bg-color); padding:4px 8px; border-radius:3px; display:flex; justify-content:space-between; border:1px solid var(--card-border);">
                      <span>${name} (${email})</span>
                      <button class="btn-danger" style="padding:1px 4px; font-size:9px;" onclick="removeSpecificLike('${doc.id}', '${uid}')">Remove</button>
                    </div>`;
          }).join('');

          let commentsHtml = comments.map(c => `
            <div style="margin-top:8px; font-size:12px; background:var(--bg-color); padding:8px; border-radius:4px; border:1px solid var(--card-border);">
              <div style="display:flex; justify-content:space-between; align-items:center;">
                <span><strong>${escapeQuotes(c.name)} (${escapeQuotes(c.email || '')}):</strong> ${escapeQuotes(c.text)}</span>
                <button class="btn-danger" style="padding:2px 6px; font-size:9px;" onclick="deleteComment('${doc.id}', '${c.id}')">Delete</button>
              </div>
              
              ${(c.replies && c.replies.length > 0) ? c.replies.map(r => `
                <div style="margin-top:4px; margin-left:10px; color:var(--text-muted); font-size:11px;">
                  ↳ <strong>Admin Reply:</strong> ${escapeQuotes(r.text)}
                </div>
              `).join('') : ''}

              <div style="display:flex; gap:5px; margin-top:6px;">
                <input type="text" id="reply-input-${c.id}" placeholder="Write admin reply..." class="form-control" style="padding:4px 8px; font-size:11px;">
                <button class="btn-primary" style="padding:4px 8px; font-size:10px;" onclick="addAdminReply('${doc.id}', '${c.id}')">REPLY</button>
              </div>
            </div>
          `).join('');

          tbody.innerHTML += `
            <tr>
              <td><strong>${data.title}</strong> ${data.isPinned ? '<span style="color:var(--accent-gold); font-size:10px;">[PINNED]</span>' : ''}<br><small style="color:var(--text-muted);">${data.subject} | By ${data.author}</small></td>
              <td>
                <button class="${data.isPinned ? 'btn-primary' : 'btn-outline'}" style="padding:4px 8px; font-size:10px;" onclick="togglePin('${doc.id}', ${data.isPinned || false})">
                  ${data.isPinned ? 'UNPIN' : 'PIN'}
                </button>
              </td>
              <td>${likes.length}</td>
              <td>${comments.length}</td>
              <td>
                <button class="btn-outline" style="padding:4px 8px; font-size:10px; margin-right:4px;" onclick="editPost('${doc.id}', \`${escapeQuotes(data.title)}\`, \`${escapeQuotes(data.author)}\`, '${data.subject}', \`${data.imageUrl || ''}\`, \`${escapeQuotes(data.content)}\`)">Edit</button>
                <button class="btn-danger" style="padding:4px 8px; font-size:10px;" onclick="deleteArticle('${doc.id}')">Delete</button>
              </td>
            </tr>
            ${(likes.length > 0 || comments.length > 0) ? `
              <tr>
                <td colspan="5" style="background:var(--bg-color); padding:10px 15px;">
                  ${likes.length > 0 ? `<div style="margin-bottom:10px;"><strong style="font-size:10px; color:var(--text-muted); letter-spacing:1px;">LIKED BY:</strong>${likersHtml}</div>` : ''}
                  ${comments.length > 0 ? `<div><strong style="font-size:10px; color:var(--text-muted); letter-spacing:1px;">COMMENTS & REPLIES:</strong>${commentsHtml}</div>` : ''}
                </td>
              </tr>
            ` : ''}
          `;
        });
        document.getElementById('totalPosts').innerText = count;
        document.getElementById('totalLikes').innerText = tLikes;

        renderUserTable();
      });
    }

    function addAdminReply(articleId, commentId) {
      const replyInput = document.getElementById(`reply-input-${commentId}`);
      const replyText = replyInput.value.trim();
      if (!replyText) return alert("Write something to reply!");

      const ref = db.collection("articles").doc(articleId);
      ref.get().then(doc => {
        if (doc.exists) {
          let comments = doc.data().comments || [];
          const cmtIndex = comments.findIndex(c => c.id === commentId);
          if (cmtIndex > -1) {
            if (!comments[cmtIndex].replies) comments[cmtIndex].replies = [];
            comments[cmtIndex].replies.push({
              id: 'rply_' + Date.now(),
              text: replyText,
              createdAt: new Date().toISOString()
            });
            ref.update({ comments }).then(() => {
              replyInput.value = '';
              alert("Reply added successfully!");
            });
          }
        }
      });
    }

    function removeSpecificLike(articleId, userUid) {
      if (!confirm("Remove like for this user?")) return;
      const ref = db.collection("articles").doc(articleId);
      ref.get().then(doc => {
        if (doc.exists) {
          let likes = doc.data().likes || [];
          likes = likes.filter(l => (typeof l === 'string' ? l !== userUid : (l.uid !== userUid && l.email !== userUid)));
          ref.update({ likes });
        }
      });
    }

    function deleteComment(articleId, commentId) {
      if (!confirm("Delete this comment?")) return;
      const ref = db.collection("articles").doc(articleId);
      ref.get().then(doc => {
        if (doc.exists) {
          const comments = (doc.data().comments || []).filter(c => c.id !== commentId);
          ref.update({ comments });
        }
      });
    }

    function deleteArticle(id) { 
      if (confirm("Delete this post permanently?")) db.collection("articles").doc(id).delete(); 
    }

    function escapeQuotes(str) { return str ? str.replace(/`/g, "\\`").replace(/"/g, "&quot;") : ''; }
  </script>
